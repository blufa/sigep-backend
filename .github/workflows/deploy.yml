name: Deploy backend

on:
  push:
    branches: [develop, master]
  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.e.outputs.env }}
    steps:
      - id: e
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "env=prod" >> "$GITHUB_OUTPUT"
          else
            echo "env=dev" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: ./mvnw -B -ntp verify

  build-push:
    needs: [setup, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      # Docker Hub renvoie de temps en temps un timeout/504 ponctuel, sans rapport avec ce dépôt —
      # retry à chaque étape qui en dépend plutôt que de laisser tout le déploiement échouer pour un
      # aléa réseau qui se résorbe tout seul (même pattern que lacaeducation/deploy.yml).
      - uses: docker/setup-buildx-action@v3
        id: buildx1
        continue-on-error: true
      - uses: docker/setup-buildx-action@v3
        if: steps.buildx1.outcome == 'failure'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build1
        continue-on-error: true
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/sigep-backend:${{ needs.setup.outputs.env }}
            ghcr.io/${{ env.OWNER }}/sigep-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        if: steps.build1.outcome == 'failure'
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/sigep-backend:${{ needs.setup.outputs.env }}
            ghcr.io/${{ env.OWNER }}/sigep-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [setup, build-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # deploy/docker-compose.yml est la source de vérité, synchronisée sur le VPS à chaque
      # déploiement — sans ça le pull/up ci-dessous tournerait contre un fichier posé là
      # manuellement à l'origine, peu importe les changements commités (même piège que
      # lacaeducation/deploy.yml). Sert aussi au service frontend (voir deploy.yml de sigep-ui).
      - name: Synchroniser deploy/docker-compose.yml vers le VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy/docker-compose.yml"
          target: "/opt/sigep"
          strip_components: 1

      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/sigep
            ENV=${{ needs.setup.outputs.env }}
            docker compose --env-file .env.$ENV -p sigep-$ENV pull backend
            # --force-recreate : sans ça, `up -d` peut garder l'ancien conteneur même si le tag
            # pointe maintenant vers une image différente (même bug vécu sur lacaeducation).
            docker compose --env-file .env.$ENV -p sigep-$ENV up -d --force-recreate backend
            docker image prune -f
