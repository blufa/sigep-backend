# Stack applicative SIGAP — paramétrée par environnement (dev / prod), déployée sur le VPS
# Hostinger partagé avec lacaeducation (même proxy Caddy, même réseau Docker « web », voir
# deploy/README.md). Même principe que lacaeducation/deploy/docker-compose.yml.
#
#   docker compose --env-file .env.prod -p sigap-prod up -d
#   docker compose --env-file .env.dev  -p sigap-dev  up -d
services:
  db:
    image: postgres:16-alpine
    container_name: ${STACK}-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  backend:
    image: ghcr.io/${GHCR_OWNER}/sigep-backend:${BACKEND_TAG}
    container_name: ${STACK}-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_PORT: "8085"
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-480}
      CORS_ALLOWED_ORIGINS: ${FRONT_URL}
      NIMBA_SMS_ENABLED: ${NIMBA_SMS_ENABLED:-true}
      NIMBA_SMS_SERVICE_ID: ${NIMBA_SMS_SERVICE_ID:-}
      NIMBA_SMS_SECRET_TOKEN: ${NIMBA_SMS_SECRET_TOKEN:-}
      NIMBA_SMS_SENDER_NAME: ${NIMBA_SMS_SENDER_NAME:-}
      NIMBA_SMS_BASE_URL: ${NIMBA_SMS_BASE_URL:-https://api.nimbasms.com}
      NIMBA_SMS_DEFAULT_DIALING: ${NIMBA_SMS_DEFAULT_DIALING:-224}
    expose:
      - "8085"
    networks: [internal, web]

  frontend:
    image: ghcr.io/${GHCR_OWNER}/sigep-frontend:${FRONTEND_TAG}
    container_name: ${STACK}-frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "3100"
    networks: [web]

volumes:
  pgdata:

networks:
  internal:
  web:
    external: true
    name: web
